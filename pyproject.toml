[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moltlupi-inference"
version = "0.1.0"
description = "Inference-only candidate discovery and evidence-based assessment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "igraph>=0.11,<2", "leidenalg>=0.10,<1", "tqdm>=4.66,<5"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.17,<2"]
test = ["pytest>=8,<10", "onnx>=1.16,<2", "onnxruntime>=1.17,<2"]

[project.scripts]
moltlupi = "moltlupi.cli:main"

[tool.setuptools.packages.find]
include = ["moltlupi*"]
